<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Studio TUTS | Crie. Conecte. Impulsione.</title>
  <meta name="description" content="Studio TUTS — produção audiovisual, FPV e criação de conteúdo. Conheça o portfólio, os serviços e fale com a gente pelo WhatsApp.">
  <meta name="theme-color" content="#070707">
  <meta name="color-scheme" content="dark">

  <meta property="og:type" content="website">
  <meta property="og:title" content="Studio TUTS">
  <meta property="og:description" content="Crie. Conecte. Impulsione. Portfólio, serviços e contato do Studio TUTS.">
  <meta property="og:image" content="https://www.studiotuts.com.br/biosite/assets/media/video-poster.jpg">

  <link rel="icon" type="image/png" href="/biosite/assets/img/logo-studio-tuts.png">

  <link rel="preconnect" href="https://api.fontshare.com" crossorigin>
  <link rel="preconnect" href="https://cdn.fontshare.com" crossorigin>
  <link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=poppins@300,400,500,600,700,800&display=swap">

  <link rel="preload" as="image" href="/biosite/assets/img/logo-studio-tuts.png">
  <link rel="stylesheet" href="/biosite/css/style.css">
</head>
<body>
  <main class="page">
    <!-- Coluna esquerda (desktop): logo, vídeo e redes sociais.
         No celular as colunas se desfazem e a ordem é definida no CSS. -->
    <div class="col col--left">
      <!-- A. LOGOTIPO -->
      <header class="brand reveal" style="--d:0">
        <h1 class="brand__title">
          <img class="brand__logo" data-config="logo" src="/biosite/assets/img/logo-studio-tuts.png"
               alt="Studio TUTS" width="1365" height="260" decoding="async">
        </h1>
      </header>

      <!-- C. BANNER / VÍDEO -->
      <section class="banner reveal" style="--d:2" aria-label="Vídeo de apresentação do Studio TUTS">
        <video class="banner__video" id="banner-video"
               muted autoplay loop playsinline disablepictureinpicture disableremoteplayback
               preload="auto" aria-hidden="true"></video>
      </section>

      <!-- D. REDES SOCIAIS -->
      <nav class="social reveal" style="--d:3" aria-label="Redes sociais">
        <a class="social__link" data-link="instagram" href="#" target="_blank" rel="noopener" aria-label="Instagram do Studio TUTS">
          <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="2.6" y="2.6" width="18.8" height="18.8" rx="5.2"/>
            <circle cx="12" cy="12" r="4.3"/>
            <circle cx="17.4" cy="6.6" r="0.6" fill="currentColor" stroke="none"/>
          </svg>
        </a>
        <span class="social__divider" aria-hidden="true"></span>
        <a class="social__link social__link--wide" data-link="youtube" href="#" target="_blank" rel="noopener" aria-label="Canal do YouTube do Studio TUTS">
          <svg viewBox="0 0 34 24" aria-hidden="true">
            <rect x="0.5" y="0.5" width="33" height="23" rx="6.5" fill="currentColor"/>
            <path d="M13.5 7.2v9.6l8.2-4.8z" fill="#070707"/>
          </svg>
        </a>
        <span class="social__divider" aria-hidden="true"></span>
        <a class="social__link" data-link="whatsapp" href="#" target="_blank" rel="noopener" aria-label="WhatsApp do Studio TUTS">
          <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3.4 20.6l1.3-4.6A9.2 9.2 0 1 1 8.2 19.4z"/>
            <path d="M9 7.6c.2-.4.5-.4.8-.4h.5c.2 0 .4.1.5.4l.7 1.7c.1.2 0 .5-.1.7l-.6.7c-.1.1-.1.3 0 .5.8 1.4 1.8 2.3 3.2 3 .2.1.4.1.5 0l.7-.8c.2-.2.4-.2.6-.1l1.6.8c.2.1.3.3.3.5 0 .7-.3 1.6-1.4 2-1 .4-2.4.2-4.4-1.1-1.6-1.1-2.9-2.6-3.5-3.9-.6-1.3-.3-2.5.6-3.9z" fill="currentColor" stroke="none"/>
          </svg>
        </a>
      </nav>
    </div>

    <!-- Coluna direita (desktop): frase de impacto e botões -->
    <div class="col col--right">
      <!-- B. FRASE DE IMPACTO -->
      <p class="headline reveal" style="--d:1">
        <span>CRIE.</span>
        <span>CONECTE.</span>
        <span>IMPULSIONE.</span>
      </p>

      <!-- E. BOTÕES PRINCIPAIS -->
      <div class="actions">
        <a class="btn reveal" style="--d:4" data-link="portfolio" href="#" target="_blank" rel="noopener">
          Portfólio e Serviços
        </a>
        <a class="btn reveal" style="--d:5" data-link="whatsapp" href="#" target="_blank" rel="noopener">
          Chame no WhatsApp
        </a>
      </div>
    </div>
  </main>

  <!-- F. RODAPÉ -->
  <footer class="footer">
    <span class="footer__line" aria-hidden="true"><span class="footer__spark"></span></span>
    <p class="footer__text">Biosite desenvolvido por Studio TUTS</p>
  </footer>

  <script src="/biosite/config.js"></script>
  <script src="/biosite/js/main.js" defer></script>
</body>
</html>
